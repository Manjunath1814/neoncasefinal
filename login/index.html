<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — NeonCase</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">


        <!-- LEFT BRAND SIDE -->

        <section class="login-visual">

            <div class="visual-content">

                <span class="brand-small">
                    NEONCASE™
                </span>

                <h1>
                    YOUR PHONE.
                    <br>
                    <span>BUT MAKE IT GLOW.</span>
                </h1>

                <p>
                    Sign in to continue your
                    NeonCase order.
                </p>

            </div>

        </section>



        <!-- RIGHT LOGIN SIDE -->

        <section class="login-card-area">

            <div class="login-card">


                <div class="login-logo">
                    neoncase<span>.in</span>
                </div>


                <div class="login-heading">

                    <span>
                        WELCOME
                    </span>

                    <h2>
                        Continue to
                        <strong>NeonCase.</strong>
                    </h2>

                    <p>
                        Sign in to continue with
                        your order.
                    </p>

                </div>


                <!-- GOOGLE LOGIN -->

                <button
                    class="google-login"
                    id="googleLogin"
                    type="button"
                >

                    <span class="google-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.75z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 13.84A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.84V7.63H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.37l3.24-2.53z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.13c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.14 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.85 9.46 6.13 12 6.13z"
                            />

                        </svg>

                    </span>


                    <span>
                        Continue with Google
                    </span>

                </button>


                <div
                    class="login-note"
                    id="loginMessage"
                >
                    Secure sign-in powered by Google.
                </div>


                <div class="login-footer">

                    By continuing, you agree to
                    NeonCase's Terms &
                    Privacy Policy.

                </div>


            </div>

        </section>


    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
