<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed — NeonCase</title>

    <link
        rel="stylesheet"
        href="success.css"
    >

</head>


<body>


<main class="success-page">


    <!-- PARTICLES -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>



    <!-- SUCCESS CONTENT -->

    <section class="success-content">


        <div class="brand">
            neoncase<span>.in</span>
        </div>


        <!-- SUCCESS ICON -->

        <div class="success-icon">

            <div class="success-ring">

                <svg
                    viewBox="0 0 100 100"
                    class="checkmark"
                >

                    <circle
                        cx="50"
                        cy="50"
                        r="44"
                        class="check-circle"
                    />

                    <path
                        d="M30 51
                           L43 64
                           L71 35"
                        class="check-path"
                    />

                </svg>

            </div>

        </div>



        <div class="success-label">
            ORDER CONFIRMED
        </div>


        <h1>
            Your glow
            <strong>is on its way.</strong>
        </h1>


        <p class="success-text">

            Thank you for choosing NeonCase.
            Your order has been successfully
            placed.

        </p>



        <!-- ORDER CARD -->

        <div class="order-card">


            <div class="order-card-top">

                <div>

                    <span>
                        ORDER
                    </span>

                    <strong id="orderId">
                        #NEONCASE
                    </strong>

                </div>


                <div class="confirmed">
                    CONFIRMED
                </div>

            </div>


            <div class="order-product">


                <div class="mini-product">

                    <img
                        src="../day-phone-case.png"
                        alt="NeonCase"
                    >

                </div>


                <div class="product-details">

                    <span>
                        NEONCASE™
                    </span>

                    <strong
                        id="modelName"
                    >
                        Glow-in-the-dark
                        phone case
                    </strong>

                    <small>
                        ₹699
                    </small>

                </div>


            </div>


            <div class="order-divider"></div>


            <div class="delivery-row">

                <div>

                    <span>
                        DELIVERY TO
                    </span>

                    <strong id="customerName">
                        Customer
                    </strong>

                </div>


                <div class="delivery-icon">
                    →
                </div>

            </div>


        </div>



        <!-- TRACK BUTTON -->

        <a
            href="../track/index.html"
            class="track-button"
        >

            TRACK YOUR ORDER

            <span>
                →
            </span>

        </a>


        <a
            href="../index.html"
            class="home-link"
        >

            BACK TO NEONCASE

        </a>


    </section>


</main>


<script
    type="module"
    src="success.js"
></script>

</body>

</html>
